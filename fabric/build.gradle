plugins {
    id 'com.github.johnrengelman.shadow'
}

def fabricOwnedSources = [
        // Fabric-specific entrypoints (in fabric/src/main/java)
        'moriz/orangesunshine/fabric/**',

        // Client sources (from ../src/main/java)
        // 'moriz/orangesunshine/compat/**',
        // 'moriz/orangesunshine/datagen/**',

        'moriz/orangesunshine/client/OrangeSunshineClient.java',
        'moriz/orangesunshine/client/PSClientConfig.java',
        'moriz/orangesunshine/client/item/**',
        'moriz/orangesunshine/client/particle/**',
        'moriz/orangesunshine/client/screen/**',
        'moriz/orangesunshine/client/sound/**',

        'moriz/orangesunshine/client/render/DrugEffectInterpreter.java',
        'moriz/orangesunshine/client/render/ItemSubmitHelper.java',
        'moriz/orangesunshine/client/render/DrugRenderer.java',
        'moriz/orangesunshine/client/render/FluidBoxRenderer.java',
        'moriz/orangesunshine/client/render/GLStateProxy.java',
        'moriz/orangesunshine/client/render/MeteorlogicalUtil.java',
        'moriz/orangesunshine/client/render/PassThroughVertexConsumer.java',
        'moriz/orangesunshine/client/render/PlacedDrinksModelProvider.java',
        'moriz/orangesunshine/client/render/PSRenderers.java',
        'moriz/orangesunshine/client/render/PsycheMatrixHelper.java',
        'moriz/orangesunshine/client/render/RastaHeadModel.java',
        'moriz/orangesunshine/client/render/RealityRiftEntityRenderer.java',
        'moriz/orangesunshine/client/render/RenderLayerUtil.java',
        'moriz/orangesunshine/client/render/RenderUtil.java',
        'moriz/orangesunshine/client/render/SmoothCameraHelper.java',
        'moriz/orangesunshine/client/render/ZeroScreen.java',
        'moriz/orangesunshine/client/render/effect/**',
        'moriz/orangesunshine/client/render/shader/**',
        'moriz/orangesunshine/client/render/bezier/BezierLabelRenderer.java',
        'moriz/orangesunshine/client/render/blocks/Barrel*.java',
        'moriz/orangesunshine/client/render/blocks/BottleRackBlockEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/DrinksBlockEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/DryingTableBlockEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/FlaskBlockEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/MashTubBlockEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/MixingTableEntityRenderer.java',
        'moriz/orangesunshine/client/render/blocks/Peyote*.java',
        'moriz/orangesunshine/client/render/blocks/RiftJar*.java',

        // Client mixins
        'moriz/orangesunshine/mixin/client/**',
]

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include fabricOwnedSources
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-debug-api-v1"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.properties([
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        fabric_api_version: rootProject.fabric_api_version
    ])

    filesMatching('fabric.mod.json') {
        expand([
            version: project.version,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_authors: rootProject.mod_authors,
            mod_license: rootProject.mod_license,
            mod_homepage: rootProject.mod_homepage,
            mod_issues: rootProject.mod_issues,
            mod_sources: rootProject.mod_sources,
            minecraft_version: rootProject.minecraft_version,
            fabric_loader_version: rootProject.fabric_loader_version,
            fabric_api_version: rootProject.fabric_api_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set('dev-shadow')
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier.set('fabric')
}

jar {
    archiveClassifier.set('dev')
}

tasks.register('smokeClient', Exec) {
    group = 'verification'
    description = 'Runs :fabric:runClient with a timeout and checks logs for CLIENT_SMOKE_OK (needs xvfb-run on headless Linux).'
    workingDir = rootProject.projectDir
    commandLine 'bash', new File(rootProject.projectDir, 'dev-tools/run_client_smoke.sh').absolutePath
}

tasks.register('visualSmokeCompile', Exec) {
    group = 'verification'
    description = 'Fast compile-only check: runs :fabric:compileJava via the visual test orchestrator. Exit 0 = pass.'
    workingDir = rootProject.projectDir
    commandLine 'python3',
        new File(rootProject.projectDir, 'dev-tools/visual_test/run_visual_tests.py').absolutePath,
        '--tier', 'compile'
}

tasks.register('visualSmokeTest', Exec) {
    group = 'verification'
    description = 'Compile + headless client bootstrap smoke test. Requires xvfb-run on Linux CI. Exit 0 = pass.'
    workingDir = rootProject.projectDir
    commandLine 'python3',
        new File(rootProject.projectDir, 'dev-tools/visual_test/run_visual_tests.py').absolutePath,
        '--tier', 'smoke'
}
