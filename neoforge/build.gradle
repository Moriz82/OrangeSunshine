plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Screen classes and render helpers from shared sources (excluded from :common by fabricOwnedSources).
// PSScreens.java excluded: uses MenuScreens.register() which is private on NeoForge.
sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include 'moriz/orangesunshine/client/screen/**'
            exclude 'moriz/orangesunshine/client/screen/PSScreens.java'
            include 'moriz/orangesunshine/client/render/FluidBoxRenderer.java'
            include 'moriz/orangesunshine/client/render/RenderUtil.java'
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.properties([
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_loader_version_range: rootProject.neoforge_loader_version_range,
        neoforge_version: rootProject.neoforge_version
    ])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            version: project.version,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_authors: rootProject.mod_authors,
            mod_license: rootProject.mod_license,
            mod_homepage: rootProject.mod_homepage,
            mod_issues: rootProject.mod_issues,
            minecraft_version: rootProject.minecraft_version,
            neoforge_loader_version_range: rootProject.neoforge_loader_version_range,
            neoforge_version: rootProject.neoforge_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set('dev-shadow')
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier.set('neoforge')
}

jar {
    archiveClassifier.set('dev')
}
