plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_plugin_version}" apply false
}
version = "${minecraft_version}-${mod_version}"
group = maven_group

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.version

    repositories {
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'MineLittlePony'; url = 'https://repo.minelittlepony-mod.com/maven/release' }
        maven { name = 'MineLittlePonySnapshots'; url = 'https://repo.minelittlepony-mod.com/maven/snapshot' }
        maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
        maven { name = 'JitPack'; url = 'https://jitpack.io' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'

    architectury {
        compileOnly()
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        }
        withSourcesJar()
    }

    loom {
        silentMojangMappingsLicense()
    }

    if (project.path != ':common') {
        loom {
            mods {
                main {
                    sourceSet project.sourceSets.main
                    sourceSet project(':common').sourceSets.main
                }
            }
            afterEvaluate {
                tasks.matching { it.name == 'runClient' }.configureEach {
                    if (rootProject.hasProperty('quickPlayWorld')) {
                        args '--quickPlaySingleplayer', rootProject.property('quickPlayWorld')
                    }
                }
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.java_version as int
    }

    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }

    publishing {
        publications {
            create('mavenJava', MavenPublication) {
                from components.java
            }
        }
    }
}
