buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        jcenter()
        mavenCentral()
        flatDir {
            dirs 'libs'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}
apply plugin:'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

version = '1.0'
group = 'com.BrotherHoodOfDiethylamide.OrangeSunshine'
archivesBaseName = 'OrangeSunshine'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

// FML discovers our mod in build/classes/java/main (where @Mod is) and uses it as the
// FMLFileResourcePack source. Without this, assets in build/resources/main are invisible
// to the resource pack since FMLFileResourcePack only looks in one directory.
// Merging resources into the classes directory ensures FML can find all assets in dev.
sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            if (project.hasProperty('runTests')) {
                property 'orangesunshine.runTests', 'true'
            }
            if (project.hasProperty('visualTests')) {
                property 'orangesunshine.visualTests', 'true'
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "OrangeSunshine",
            "Specification-Vendor": "BrotherHoodOfDiethylamide",
            "Specification-Version": "1.0",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"BrotherHoodOfDiethylamide",
        ])
    }
    // Exclude our dev-only Side.java fix from the production jar.
    // The ForgeGradle 3.0 mapped dev jar has a spurious BUKKIT enum constant in
    // net.minecraftforge.fml.relauncher.Side that the production Forge jar does not.
    // We provide our own Side.class (dev environment only) to work around the resulting NPE.
    exclude 'net/minecraftforge/fml/relauncher/Side.class'
    exclude 'net/minecraftforge/fml/relauncher/Side$*.class'
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
